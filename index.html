                                </div>

                                <div className="flex items-baseline gap-4">
                                    <span className="text-4xl font-black text-primary">R$ {selectedProduct.price.toFixed(2)}</span>
                                    {selectedProduct.oldPrice && (
                                        <span className="text-xl text-gray-400 line-through">R$ {selectedProduct.oldPrice.toFixed(2)}</span>
                                    )}
                                    {selectedProduct.discount > 0 && (
                                        <span className="px-3 py-1 bg-red-100 dark:bg-red-900/30 text-red-600 dark:text-red-400 rounded-full text-sm font-bold">
                                            Economize R$ {(selectedProduct.oldPrice - selectedProduct.price).toFixed(2)}
                                        </span>
                                    )}
                                </div>

                                <div className="border-t border-b border-gray-100 dark:border-gray-800 py-6">
                                    <div className="flex gap-6">
                                        <button onClick={() => setActiveTab('desc')} className={`text-sm font-semibold pb-2 border-b-2 transition-colors ${activeTab === 'desc' ? 'border-primary text-primary' : 'border-transparent text-gray-500 hover:text-gray-700 dark:hover:text-gray-300'}`}>
                                            Descrição
                                        </button>
                                        <button onClick={() => setActiveTab('details')} className={`text-sm font-semibold pb-2 border-b-2 transition-colors ${activeTab === 'details' ? 'border-primary text-primary' : 'border-transparent text-gray-500 hover:text-gray-700 dark:hover:text-gray-300'}`}>
                                            Detalhes
                                        </button>
                                        <button onClick={() => setActiveTab('shipping')} className={`text-sm font-semibold pb-2 border-b-2 transition-colors ${activeTab === 'shipping' ? 'border-primary text-primary' : 'border-transparent text-gray-500 hover:text-gray-700 dark:hover:text-gray-300'}`}>
                                            Envio
                                        </button>
                                    </div>
                                    <div className="mt-4">
                                        {activeTab === 'desc' && (
                                            <p className="text-gray-600 dark:text-gray-300 leading-relaxed">{selectedProduct.description}</p>
                                        )}
                                        {activeTab === 'details' && (
                                            <ul className="space-y-2 text-gray-600 dark:text-gray-300">
                                                <li className="flex items-center gap-2"><i className="fas fa-check text-primary text-sm"></i> Material premium de alta qualidade</li>
                                                <li className="flex items-center gap-2"><i className="fas fa-check text-primary text-sm"></i> Acabamento impecável</li>
                                                <li className="flex items-center gap-2"><i className="fas fa-check text-primary text-sm"></i> Design exclusivo NOVA</li>
                                                <li className="flex items-center gap-2"><i className="fas fa-check text-primary text-sm"></i> Garantia de 30 dias</li>
                                            </ul>
                                        )}
                                        {activeTab === 'shipping' && (
                                            <div className="space-y-3 text-gray-600 dark:text-gray-300">
                                                <p><i className="fas fa-truck text-primary mr-2"></i> Frete grátis para compras acima de R$ 299</p>
                                                <p><i className="fas fa-clock text-primary mr-2"></i> Entrega em 3-7 dias úteis</p>
                                                <p><i className="fas fa-undo text-primary mr-2"></i> Devolução gratuita em até 30 dias</p>
                                            </div>
                                        )}
                                    </div>
                                </div>

                                <div>
                                    <h3 className="font-semibold dark:text-white mb-3">Cor: <span className="text-gray-500 font-normal">{selectedProduct.colorNames[selectedColorIdx]}</span></h3>
                                    <div className="flex gap-3">
                                        {selectedProduct.colors.map((color, idx) => (
                                            <button key={idx} onClick={() => setSelectedColorIdx(idx)}
                                                className={`w-12 h-12 rounded-full border-2 transition-all relative ${
                                                    selectedColorIdx === idx ? 'border-primary scale-110 shadow-lg shadow-primary/20' : 'border-gray-200 dark:border-gray-700'
                                                }`}
                                                style={{ backgroundColor: color }}>
                                                {selectedColorIdx === idx && (
                                                    <i className="fas fa-check text-white absolute inset-0 flex items-center justify-center text-sm drop-shadow-md"></i>
                                                )}
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                <div>
                                    <h3 className="font-semibold dark:text-white mb-3">Tamanho</h3>
                                    <div className="flex flex-wrap gap-2">
                                        {selectedProduct.sizes.map(size => (
                                            <button key={size} onClick={() => setSelectedSize(size)}
                                                className={`px-6 py-3 rounded-xl font-medium transition-all ${
                                                    selectedSize === size
                                                        ? 'bg-gradient-premium text-white shadow-lg shadow-primary/30'
                                                        : 'bg-gray-100 dark:bg-darkSecondary text-gray-700 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-800'
                                                }`}>
                                                {size}
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                <div>
                                    <h3 className="font-semibold dark:text-white mb-3">Quantidade</h3>
                                    <div className="flex items-center gap-4">
                                        <button onClick={() => setQuantity(Math.max(1, quantity - 1))}
                                            className="w-12 h-12 rounded-full bg-gray-100 dark:bg-darkSecondary flex items-center justify-center hover:bg-gray-200 dark:hover:bg-gray-800 transition-colors dark:text-white">
                                            <i className="fas fa-minus"></i>
                                        </button>
                                        <span className="text-2xl font-bold w-12 text-center dark:text-white">{quantity}</span>
                                        <button onClick={() => setQuantity(Math.min(selectedProduct.stock, quantity + 1))}
                                            className="w-12 h-12 rounded-full bg-gray-100 dark:bg-darkSecondary flex items-center justify-center hover:bg-gray-200 dark:hover:bg-gray-800 transition-colors dark:text-white">
                                            <i className="fas fa-plus"></i>
                                        </button>
                                    </div>
                                </div>

                                <div className="flex gap-4 pt-4">
                                    <button onClick={handleAddToCart}
                                        className="flex-1 py-4 bg-gradient-premium text-white rounded-full font-bold text-lg hover:opacity-90 transition-opacity shadow-lg shadow-primary/30 flex items-center justify-center gap-3">
                                        <i className="fas fa-shopping-bag"></i>
                                        Adicionar ao Carrinho
                                    </button>
                                    <button onClick={() => toggleWishlist(selectedProduct.id)}
                                        className={`w-16 h-16 rounded-full flex items-center justify-center transition-all ${
                                            wishlist.includes(selectedProduct.id)
                                                ? 'bg-red-500 text-white shadow-lg shadow-red-500/30'
                                                : 'bg-gray-100 dark:bg-darkSecondary text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-800'
                                        }`}>
                                        <i className={`${wishlist.includes(selectedProduct.id) ? 'fas' : 'far'} fa-heart text-xl`}></i>
                                    </button>
                                </div>

                                <div className="grid grid-cols-2 gap-4 pt-6">
                                    {[
                                        { icon: 'fa-truck', text: 'Frete Grátis', sub: 'Acima de R$ 299' },
                                        { icon: 'fa-undo', text: '30 Dias', sub: 'Para Troca' },
                                        { icon: 'fa-shield-alt', text: 'Pagamento', sub: '100% Seguro' },
                                        { icon: 'fa-headset', text: 'Suporte', sub: '24/7 Online' }
                                    ].map((benefit, idx) => (
                                        <div key={idx} className="flex items-center gap-3 p-4 bg-gray-50 dark:bg-darkSecondary rounded-xl border border-gray-100 dark:border-gray-800">
                                            <div className="w-10 h-10 rounded-full bg-primary/10 flex items-center justify-center">
                                                <i className={`fas ${benefit.icon} text-primary text-lg`}></i>
                                            </div>
                                            <div>
                                                <p className="font-semibold text-sm dark:text-white">{benefit.text}</p>
                                                <p className="text-xs text-gray-500">{benefit.sub}</p>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>

                        {relatedProducts.length > 0 && (
                            <div className="mt-20">
                                <h2 className="text-3xl font-black mb-8 dark:text-white">Produtos Relacionados</h2>
                                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
                                    {relatedProducts.map(product => (
                                        <ProductCard key={product.id} product={product} />
                                    ))}
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const WishlistPage = () => {
            const { wishlist, productsData, setCurrentPage } = useApp();
            const wishlistProducts = productsData.filter(p => wishlist.includes(p.id));

            return (
                <div className="min-h-screen bg-white dark:bg-dark pt-24">
                    <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
                        <div className="flex items-center gap-3 mb-8">
                            <div className="w-12 h-12 rounded-full bg-red-100 dark:bg-red-900/20 flex items-center justify-center">
                                <i className="fas fa-heart text-red-500 text-xl"></i>
                            </div>
                            <div>
                                <h1 className="text-4xl font-black dark:text-white">Meus Favoritos</h1>
                                <p className="text-gray-500 dark:text-gray-400">{wishlistProducts.length} {wishlistProducts.length === 1 ? 'item' : 'itens'} salvos</p>
                            </div>
                        </div>

                        {wishlistProducts.length === 0 ? (
                            <div className="text-center py-20 bg-gray-50 dark:bg-darkSecondary rounded-3xl">
                                <i className="far fa-heart text-6xl text-gray-300 dark:text-gray-700 mb-4"></i>
                                <p className="text-gray-500 dark:text-gray-400 text-lg mb-2">Sua lista de favoritos está vazia</p>
                                <p className="text-sm text-gray-400 dark:text-gray-500 mb-6">Salve seus produtos favoritos para encontrá-los facilmente depois</p>
                                <button onClick={() => setCurrentPage('home')}
                                    className="px-8 py-3 bg-gradient-premium text-white rounded-full font-bold hover:opacity-90 transition-opacity shadow-lg shadow-primary/30">
                                    Explorar Produtos
                                </button>
                            </div>
                        ) : (
                            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8">
                                {wishlistProducts.map(product => (
                                    <ProductCard key={product.id} product={product} />
                                ))}
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const ComparePage = () => {
            const { compareList, productsData, toggleCompare, setSelectedProduct, setCurrentPage } = useApp();
            const compareProducts = productsData.filter(p => compareList.includes(p.id));

            if (compareProducts.length === 0) {
                return (
                    <div className="min-h-screen bg-white dark:bg-dark pt-24 flex items-center justify-center">
                        <div className="text-center">
                            <i className="fas fa-exchange-alt text-6xl text-gray-300 dark:text-gray-700 mb-4"></i>
                            <p className="text-gray-500 dark:text-gray-400 text-lg mb-6">Nenhum produto para comparar</p>
                            <button onClick={() => setCurrentPage('home')}
                                className="px-8 py-3 bg-gradient-premium text-white rounded-full font-bold hover:opacity-90 transition-opacity">
                                Explorar Produtos
                            </button>
                        </div>
                    </div>
                );
            }

            const features = ['price', 'rating', 'discount', 'stock'];
            const featureLabels = { price: 'Preço', rating: 'Avaliação', discount: 'Desconto', stock: 'Estoque' };

            return (
                <div className="min-h-screen bg-white dark:bg-dark pt-24">
                    <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
                        <div className="flex items-center justify-between mb-8">
                            <h1 className="text-4xl font-black dark:text-white">Comparar Produtos</h1>
                            <button onClick={() => compareProducts.forEach(p => toggleCompare(p.id))}
                                className="px-4 py-2 text-red-500 font-medium hover:bg-red-50 dark:hover:bg-red-900/20 rounded-xl transition-colors">
                                <i className="fas fa-trash-alt mr-2"></i>Limpar comparação
                            </button>
                        </div>

                        <div className="overflow-x-auto">
                            <table className="w-full">
                                <thead>
                                    <tr>
                                        <th className="text-left p-4 text-gray-500 dark:text-gray-400 font-medium">Característica</th>
                                        {compareProducts.map(product => (
                                            <th key={product.id} className="p-4 min-w-[200px]">
                                                <div className="text-center">
                                                    <img src={product.image} alt={product.name} className="w-32 h-40 object-cover rounded-xl mx-auto mb-3" />
                                                    <h3 className="font-bold dark:text-white text-sm">{product.name}</h3>
                                                    <button onClick={() => toggleCompare(product.id)}
                                                        className="mt-2 text-xs text-red-500 hover:underline">Remover</button>
                                                </div>
                                            </th>
                                        ))}
                                    </tr>
                                </thead>
                                <tbody>
                                    {features.map(feature => (
                                        <tr key={feature} className="border-t border-gray-100 dark:border-gray-800">
                                            <td className="p-4 font-medium text-gray-700 dark:text-gray-300">{featureLabels[feature]}</td>
                                            {compareProducts.map(product => (
                                                <td key={product.id} className="p-4 text-center">
                                                    {feature === 'price' && (
                                                        <div>
                                                            <span className="text-lg font-bold text-primary">R$ {product[feature].toFixed(2)}</span>
                                                            {product.oldPrice && (
                                                                <span className="block text-sm text-gray-400 line-through">R$ {product.oldPrice.toFixed(2)}</span>
                                                            )}
                                                        </div>
                                                    )}
                                                    {feature === 'rating' && (
                                                        <div className="flex items-center justify-center gap-1 text-yellow-400">
                                                            <i className="fas fa-star"></i>
                                                            <span className="font-bold dark:text-white">{product[feature]}</span>
                                                        </div>
                                                    )}
                                                    {feature === 'discount' && (
                                                        <span className={`font-bold ${product[feature] > 0 ? 'text-red-500' : 'text-gray-400'}`}>
                                                            {product[feature] > 0 ? `-${product[feature]}%` : 'Sem desconto'}
                                                        </span>
                                                    )}
                                                    {feature === 'stock' && (
                                                        <span className={`font-medium ${product[feature] <= 5 ? 'text-red-500' : product[feature] <= 15 ? 'text-orange-500' : 'text-green-500'}`}>
                                                            {product[feature]} unidades
                                                        </span>
                                                    )}
                                                </td>
                                            ))}
                                        </tr>
                                    ))}
                                    <tr className="border-t border-gray-100 dark:border-gray-800">
                                        <td className="p-4 font-medium text-gray-700 dark:text-gray-300">Cores</td>
                                        {compareProducts.map(product => (
                                            <td key={product.id} className="p-4 text-center">
                                                <div className="flex justify-center gap-1">
                                                    {product.colors.map((color, idx) => (
                                                        <span key={idx} className="w-6 h-6 rounded-full border border-gray-200 dark:border-gray-700" style={{ backgroundColor: color }}></span>
                                                    ))}
                                                </div>
                                            </td>
                                        ))}
                                    </tr>
                                    <tr className="border-t border-gray-100 dark:border-gray-800">
                                        <td className="p-4 font-medium text-gray-700 dark:text-gray-300">Ações</td>
                                        {compareProducts.map(product => (
                                            <td key={product.id} className="p-4 text-center">
                                                <button onClick={() => { setSelectedProduct(product); setCurrentPage('product'); }}
                                                    className="px-4 py-2 bg-gradient-premium text-white rounded-full text-sm font-semibold hover:opacity-90 transition-opacity">
                                                    Ver Produto
                                                </button>
                                            </td>
                                        ))}
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            );
        };

        const CheckoutPage = () => {
            const { cart, cartTotal, setCurrentPage } = useApp();
            const [step, setStep] = useState(1);
            const [formData, setFormData] = useState({});

            if (cart.length === 0) {
                return (
                    <div className="min-h-screen bg-white dark:bg-dark pt-24 flex items-center justify-center">
                        <div className="text-center">
                            <div className="w-24 h-24 bg-gray-100 dark:bg-darkSecondary rounded-full flex items-center justify-center mx-auto mb-6">
                                <i className="fas fa-shopping-bag text-4xl text-gray-400"></i>
                            </div>
                            <p className="text-gray-500 dark:text-gray-400 text-lg mb-2">Seu carrinho está vazio</p>
                            <p className="text-sm text-gray-400 dark:text-gray-500 mb-6">Adicione produtos para continuar com a compra</p>
                            <button onClick={() => setCurrentPage('home')}
                                className="px-8 py-3 bg-gradient-premium text-white rounded-full font-bold hover:opacity-90 transition-opacity shadow-lg shadow-primary/30">
                                Voltar às Compras
                            </button>
                        </div>
                    </div>
                );
            }

            const steps = [
                { label: 'Carrinho', icon: 'fa-shopping-bag' },
                { label: 'Envio', icon: 'fa-truck' },
                { label: 'Pagamento', icon: 'fa-credit-card' }
            ];

            return (
                <div className="min-h-screen bg-white dark:bg-dark pt-24">
                    <div className="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
                        <h1 className="text-4xl font-black mb-8 dark:text-white">Finalizar Compra</h1>

                        <div className="flex items-center justify-between mb-12 max-w-2xl mx-auto">
                            {steps.map((s, idx) => (
                                <div key={idx} className="flex items-center gap-3 flex-1">
                                    <div className={`w-12 h-12 rounded-full flex items-center justify-center transition-all ${
                                        step > idx + 1 ? 'bg-gradient-premium text-white shadow-lg shadow-primary/30' : 
                                        step === idx + 1 ? 'bg-primary text-white shadow-lg shadow-primary/30' : 
                                        'bg-gray-100 dark:bg-darkSecondary text-gray-400'
                                    }`}>
                                        {step > idx + 1 ? <i className="fas fa-check"></i> : <i className={`fas ${s.icon}`}></i>}
                                    </div>
                                    <div className="hidden sm:block">
                                        <p className={`text-sm font-semibold ${step >= idx + 1 ? 'dark:text-white' : 'text-gray-400'}`}>{s.label}</p>
                                    </div>
                                    {idx < steps.length - 1 && (
                                        <div className={`flex-1 h-1 rounded-full mx-2 ${step > idx + 1 ? 'bg-gradient-premium' : 'bg-gray-200 dark:bg-darkSecondary'}`}></div>
                                    )}
                                </div>
                            ))}
                        </div>

                        <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                            <div className="lg:col-span-2 space-y-6">
                                {step === 1 && (
                                    <div className="space-y-4">
                                        <h2 className="text-xl font-bold dark:text-white flex items-center gap-2">
                                            <i className="fas fa-shopping-bag text-primary"></i> Revise seus itens
                                        </h2>
                                        <div className="space-y-4">
                                            {cart.map(item => (
                                                <div key={item.cartId} className="flex gap-4 p-4 bg-gray-50 dark:bg-darkSecondary rounded-2xl border border-gray-100 dark:border-gray-800">
                                                    <img src={item.image} alt={item.name} className="w-20 h-24 object-cover rounded-xl" />
                                                    <div className="flex-1">
                                                        <h3 className="font-semibold dark:text-white">{item.name}</h3>
                                                        <p className="text-sm text-gray-500 dark:text-gray-400">{item.quantity}x {item.size} - {item.color}</p>
                                                        <p className="font-bold text-primary mt-2">R$ {(item.price * item.quantity).toFixed(2)}</p>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                        <button onClick={() => setStep(2)}
                                            className="w-full py-4 bg-gradient-premium text-white rounded-full font-bold hover:opacity-90 transition-opacity shadow-lg shadow-primary/30">
                                            Continuar para Envio <i className="fas fa-arrow-right ml-2"></i>
                                        </button>
                                    </div>
                                )}

                                {step === 2 && (
                                    <div className="space-y-4">
                                        <h2 className="text-xl font-bold dark:text-white flex items-center gap-2">
                                            <i className="fas fa-truck text-primary"></i> Dados de Envio
                                        </h2>
                                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                            <input type="text" placeholder="Nome completo" 
                                                className="col-span-2 p-4 rounded-xl bg-gray-50 dark:bg-darkSecondary border border-gray-200 dark:border-gray-700 outline-none focus:border-primary dark:text-white transition-colors" />
                                            <input type="text" placeholder="CEP" 
                                                className="p-4 rounded-xl bg-gray-50 dark:bg-darkSecondary border border-gray-200 dark:border-gray-700 outline-none focus:border-primary dark:text-white transition-colors" />
                                            <input type="text" placeholder="Cidade" 
                                                className="p-4 rounded-xl bg-gray-50 dark:bg-darkSecondary border border-gray-200 dark:border-gray-700 outline-none focus:border-primary dark:text-white transition-colors" />
                                            <input type="text" placeholder="Endereço" 
                                                className="col-span-2 p-4 rounded-xl bg-gray-50 dark:bg-darkSecondary border border-gray-200 dark:border-gray-700 outline-none focus:border-primary dark:text-white transition-colors" />
                                            <input type="text" placeholder="Número" 
                                                className="p-4 rounded-xl bg-gray-50 dark:bg-darkSecondary border border-gray-200 dark:border-gray-700 outline-none focus:border-primary dark:text-white transition-colors" />
                                            <input type="text" placeholder="Complemento" 
                                                className="p-4 rounded-xl bg-gray-50 dark:bg-darkSecondary border border-gray-200 dark:border-gray-700 outline-none focus:border-primary dark:text-white transition-colors" />
                                        </div>
                                        <div className="flex gap-4">
                                            <button onClick={() => setStep(1)}
                                                className="flex-1 py-4 border border-gray-300 dark:border-gray-700 rounded-full font-bold hover:bg-gray-50 dark:hover:bg-darkSecondary transition-colors dark:text-white">
                                                <i className="fas fa-arrow-left mr-2"></i> Voltar
                                            </button>
                                            <button onClick={() => setStep(3)}
                                                className="flex-1 py-4 bg-gradient-premium text-white rounded-full font-bold hover:opacity-90 transition-opacity shadow-lg shadow-primary/30">
                                                Continuar <i className="fas fa-arrow-right ml-2"></i>
                                            </button>
                                        </div>
                                    </div>
                                )}

                                {step === 3 && (
                                    <div className="space-y-4">
                                        <h2 className="text-xl font-bold dark:text-white flex items-center gap-2">
                                            <i className="fas fa-credit-card text-primary"></i> Pagamento
                                        </h2>
                                        <div className="space-y-3">
                                            <div className="grid grid-cols-2 gap-3">
                                                <button className="p-4 border-2 border-primary rounded-xl bg-primary/5 dark:bg-primary/10 flex items-center justify-center gap-3">
                                                    <i className="far fa-credit-card text-primary text-xl"></i>
                                                    <span className="font-semibold dark:text-white">Cartão</span>
                                                </button>
                                                <button className="p-4 border-2 border-gray-200 dark:border-gray-700 rounded-xl flex items-center justify-center gap-3 hover:border-gray-300 dark:hover:border-gray-600 transition-colors">
                                                    <i className="fas fa-qrcode text-gray-400 text-xl"></i>
                                                    <span className="font-semibold text-gray-600 dark:text-gray-300">PIX</span>
                                                </button>
                                            </div>
                                            <input type="text" placeholder="Número do Cartão" 
                                                className="w-full p-4 rounded-xl bg-gray-50 dark:bg-darkSecondary border border-gray-200 dark:border-gray-700 outline-none focus:border-primary dark:text-white transition-colors" />
                                            <input type="text" placeholder="Nome no cartão" 
                                                className="w-full p-4 rounded-xl bg-gray-50 dark:bg-darkSecondary border border-gray-200 dark:border-gray-700 outline-none focus:border-primary dark:text-white transition-colors" />
                                            <div className="grid grid-cols-2 gap-4">
                                                <input type="text" placeholder="Validade (MM/AA)" 
                                                    className="p-4 rounded-xl bg-gray-50 dark:bg-darkSecondary border border-gray-200 dark:border-gray-700 outline-none focus:border-primary dark:text-white transition-colors" />
                                                <input type="text" placeholder="CVV" 
                                                    className="p-4 rounded-xl bg-gray-50 dark:bg-darkSecondary border border-gray-200 dark:border-gray-700 outline-none focus:border-primary dark:text-white transition-colors" />
                                            </div>
                                        </div>
                                        <div className="flex gap-4 pt-4">
                                            <button onClick={() => setStep(2)}
                                                className="flex-1 py-4 border border-gray-300 dark:border-gray-700 rounded-full font-bold hover:bg-gray-50 dark:hover:bg-darkSecondary transition-colors dark:text-white">
                                                <i className="fas fa-arrow-left mr-2"></i> Voltar
                                            </button>
                                            <button onClick={() => { alert('Pedido realizado com sucesso! Obrigado por comprar na NOVA.'); setCurrentPage('home'); }}
                                                className="flex-1 py-4 bg-gradient-premium text-white rounded-full font-bold hover:opacity-90 transition-opacity shadow-lg shadow-primary/30 flex items-center justify-center gap-2">
                                                <i className="fas fa-lock"></i> Pagar R$ {cartTotal.toFixed(2)}
                                            </button>
                                        </div>
                                    </div>
                                )}
                            </div>

                            <div className="bg-gray-50 dark:bg-darkSecondary rounded-2xl p-6 h-fit border border-gray-100 dark:border-gray-800">
                                <h3 className="font-bold text-lg mb-4 dark:text-white">Resumo do Pedido</h3>
                                <div className="space-y-3 mb-6">
                                    {cart.map(item => (
                                        <div key={item.cartId} className="flex justify-between text-sm">
                                            <span className="text-gray-600 dark:text-gray-400">{item.name} x{item.quantity}</span>
                                            <span className="font-medium dark:text-white">R$ {(item.price * item.quantity).toFixed(2)}</span>
                                        </div>
                                    ))}
                                    <div className="border-t border-gray-200 dark:border-gray-700 pt-3 flex justify-between text-sm text-gray-600 dark:text-gray-400">
                                        <span>Subtotal</span>
                                        <span>R$ {cartTotal.toFixed(2)}</span>
                                    </div>
                                    <div className="flex justify-between text-sm text-gray-600 dark:text-gray-400">
                                        <span>Frete</span>
                                        <span className="text-green-500 font-medium">Grátis</span>
                                    </div>
                                    <div className="border-t border-gray-200 dark:border-gray-700 pt-3 flex justify-between">
                                        <span className="font-bold dark:text-white">Total</span>
                                        <span className="font-bold text-2xl text-primary">R$ {cartTotal.toFixed(2)}</span>
                                    </div>
                                </div>
                                <div className="space-y-2">
                                    <div className="flex items-center gap-2 text-xs text-gray-500 dark:text-gray-400">
                                        <i className="fas fa-shield-alt text-green-500"></i>
                                        <span>Pagamento 100% seguro</span>
                                    </div>
                                    <div className="flex items-center gap-2 text-xs text-gray-500 dark:text-gray-400">
                                        <i className="fas fa-truck text-green-500"></i>
                                        <span>Entrega em 3-7 dias úteis</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const ContactPage = () => {
            const [submitted, setSubmitted] = useState(false);

            const handleSubmit = (e) => {
                e.preventDefault();
                setSubmitted(true);
            };

            return (
                <div className="min-h-screen bg-white dark:bg-dark pt-24">
                    <div className="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
                        <div className="text-center mb-12">
                            <h1 className="text-4xl md:text-5xl font-black mb-4 dark:text-white">Entre em Contato</h1>
                            <p className="text-gray-600 dark:text-gray-400 max-w-xl mx-auto">Estamos aqui para ajudar. Envie sua mensagem e responderemos o mais breve possível.</p>
                        </div>

                        <div className="grid grid-cols-1 lg:grid-cols-2 gap-12">
                            <div className="space-y-8">
                                <div className="flex items-start gap-4 p-6 bg-gray-50 dark:bg-darkSecondary rounded-2xl border border-gray-100 dark:border-gray-800 hover:border-primary/30 transition-colors">
                                    <div className="w-14 h-14 bg-primary/10 rounded-2xl flex items-center justify-center flex-shrink-0">
                                        <i className="fas fa-map-marker-alt text-primary text-xl"></i>
                                    </div>
                                    <div>
                                        <h3 className="font-bold text-lg dark:text-white mb-1">Endereço</h3>
                                        <p className="text-gray-600 dark:text-gray-400">Av. Fashion, 1234<br/>São Paulo, SP - 01234-567</p>
                                    </div>
                                </div>
                                <div className="flex items-start gap-4 p-6 bg-gray-50 dark:bg-darkSecondary rounded-2xl border border-gray-100 dark:border-gray-800 hover:border-primary/30 transition-colors">
                                    <div className="w-14 h-14 bg-primary/10 rounded-2xl flex items-center justify-center flex-shrink-0">
                                        <i className="fas fa-phone text-primary text-xl"></i>
                                    </div>
                                    <div>
                                        <h3 className="font-bold text-lg dark:text-white mb-1">Telefone</h3>
                                        <p className="text-gray-600 dark:text-gray-400">(61) 99241-2437</p>
                                        <p className="text-sm text-gray-400">Seg-Sex, 9h às 18h</p>
                                    </div>
                                </div>
                                <div className="flex items-start gap-4 p-6 bg-gray-50 dark:bg-darkSecondary rounded-2xl border border-gray-100 dark:border-gray-800 hover:border-primary/30 transition-colors">
                                    <div className="w-14 h-14 bg-primary/10 rounded-2xl flex items-center justify-center flex-shrink-0">
                                        <i className="fas fa-envelope text-primary text-xl"></i>
                                    </div>
                                    <div>
                                        <h3 className="font-bold text-lg dark:text-white mb-1">E-mail</h3>
                                        <p className="text-gray-600 dark:text-gray-400">iago180609@gmail.com</p>
                                        <p className="text-sm text-gray-400">Respondemos em até 24h</p>
                                    </div>
                                </div>
                            </div>

                            {submitted ? (
                                <div className="flex items-center justify-center bg-gray-50 dark:bg-darkSecondary rounded-3xl border border-gray-100 dark:border-gray-800 p-12">
                                    <div className="text-center">
                                        <div className="w-20 h-20 bg-green-100 dark:bg-green-900/20 rounded-full flex items-center justify-center mx-auto mb-4">
                                            <i className="fas fa-check-circle text-green-500 text-3xl"></i>
                                        </div>
                                        <h3 className="text-2xl font-bold dark:text-white mb-2">Mensagem Enviada!</h3>
                                        <p className="text-gray-500 dark:text-gray-400">Obrigado por entrar em contato. Responderemos em breve.</p>
                                    </div>
                                </div>
                            ) : (
                                <form onSubmit={handleSubmit} className="space-y-4 bg-gray-50 dark:bg-darkSecondary rounded-3xl border border-gray-100 dark:border-gray-800 p-8">
                                    <div className="grid grid-cols-2 gap-4">
                                        <input type="text" placeholder="Nome" required
                                            className="p-4 rounded-xl bg-white dark:bg-dark border border-gray-200 dark:border-gray-700 outline-none focus:border-primary dark:text-white transition-colors" />
                                        <input type="email" placeholder="E-mail" required
                                            className="p-4 rounded-xl bg-white dark:bg-dark border border-gray-200 dark:border-gray-700 outline-none focus:border-primary dark:text-white transition-colors" />
                                    </div>
                                    <input type="text" placeholder="Assunto" required
                                        className="w-full p-4 rounded-xl bg-white dark:bg-dark border border-gray-200 dark:border-gray-700 outline-none focus:border-primary dark:text-white transition-colors" />
                                    <textarea placeholder="Sua mensagem" rows="6" required
                                        className="w-full p-4 rounded-xl bg-white dark:bg-dark border border-gray-200 dark:border-gray-700 outline-none focus:border-primary dark:text-white resize-none transition-colors"></textarea>
                                    <button type="submit"
                                        className="w-full py-4 bg-gradient-premium text-white rounded-full font-bold hover:opacity-90 transition-opacity shadow-lg shadow-primary/30 flex items-center justify-center gap-2">
                                        <i className="fas fa-paper-plane"></i> Enviar Mensagem
                                    </button>
                                </form>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const { currentPage, toasts, quickViewProduct } = useApp();

            return (
                <div className="min-h-screen">
                    <Header />
                    <SearchModal />
                    {quickViewProduct && <QuickViewModal />}

                    {toasts.map(toast => (
                        <Toast key={toast.id} message={toast.message} type={toast.type} />
                    ))}

                    {currentPage === 'home' && (
                        <>
                            <HeroSection />
                            <NewArrivals />
                            <CatalogSection />
                            <FeaturedBanner />
                            <Newsletter />
                        </>
                    )}

                    {currentPage === 'product' && <ProductDetail />}
                    {currentPage === 'wishlist' && <WishlistPage />}
                    {currentPage === 'compare' && <ComparePage />}
                    {currentPage === 'checkout' && <CheckoutPage />}
                    {currentPage === 'contato' && <ContactPage />}

                    <Footer />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(
            <AppProvider>
                <App />
            </AppProvider>
        );
    </script>
</body>
</html>
