    <style>
        * { scroll-behavior: smooth; }
        body { font-family: 'Inter', sans-serif; }

        .glass {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        .dark .glass {
            background: rgba(15, 15, 15, 0.92);
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .dark .glass-card {
            background: rgba(26, 26, 26, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .text-gradient {
            background: linear-gradient(135deg, #7C3AED 0%, #2563EB 50%, #9333EA 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .bg-gradient-premium {
            background: linear-gradient(135deg, #7C3AED 0%, #2563EB 100%);
        }

        .product-image-container {
            overflow: hidden;
            position: relative;
        }
        .product-image-container img {
            transition: transform 0.7s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .product-card:hover .product-image-container img {
            transform: scale(1.08);
        }
        .product-card:hover .product-overlay {
            opacity: 1;
        }
        .product-overlay {
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .parallax-bg {
            background-attachment: fixed;
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
        }
        @media (max-width: 768px) {
            .parallax-bg { background-attachment: scroll; }
        }

        .toast-enter {
            animation: toastEnter 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes toastEnter {
            from { transform: translateX(100%) scale(0.9); opacity: 0; }
            to { transform: translateX(0) scale(1); opacity: 1; }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.6s ease-out forwards;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-slide-up {
            animation: slideUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        .skeleton {
            background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }
        .dark .skeleton {
            background: linear-gradient(90deg, #2a2a2a 25%, #3a3a3a 50%, #2a2a2a 75%);
            background-size: 200% 100%;
        }

        .line-clamp-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .filter-chip {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .filter-chip.active {
            box-shadow: 0 4px 14px rgba(124, 58, 237, 0.35);
        }

        .quick-view-modal {
            animation: modalIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes modalIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .stagger-children > * {
            opacity: 0;
            animation: fadeIn 0.5s ease-out forwards;
        }

        .price-tag {
            position: relative;
        }
        .price-tag::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 0;
            height: 2px;
            background: linear-gradient(90deg, #7C3AED, #2563EB);
            transition: width 0.3s ease;
        }
        .product-card:hover .price-tag::after {
            width: 100%;
        }

        .badge-pulse {
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .scroll-indicator {
            animation: bounceSoft 2s infinite;
        }
        @keyframes bounceSoft {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(10px); }
        }

        @media (min-width: 1024px) {
            .catalog-layout {
                display: grid;
                grid-template-columns: 260px 1fr;
                gap: 2rem;
            }
        }

        .color-swatch {
            position: relative;
            overflow: hidden;
        }
        .color-swatch::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 50%;
            box-shadow: inset 0 0 0 2px rgba(255,255,255,0.3);
        }

        .range-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: #e5e7eb;
            outline: none;
        }
        .dark .range-slider {
            background: #374151;
        }
        .range-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #7C3AED;
            cursor: pointer;
            border: 2px solid white;
            box-shadow: 0 2px 6px rgba(124, 58, 237, 0.4);
        }

        .product-list-item {
            transition: all 0.3s ease;
        }
        .product-list-item:hover {
            transform: translateX(4px);
        }
    </style>

                colorNames: ["Preto","Vermelho","Roxo"],
                description: "Vestido de festa com brilho sutil e corte favorecedor. Perfeito para ocasiões especiais e noites inesquecíveis.",
                tags: ["new", "trending"],
                stock: 5

        ];

        const AppContext = createContext();

        const AppProvider = ({ children }) => {
            const [darkMode, setDarkMode] = useState(false);
            const [cart, setCart] = useState([]);
            const [wishlist, setWishlist] = useState([]);
            const [toasts, setToasts] = useState([]);
            const [currentPage, setCurrentPage] = useState('home');
            const [selectedProduct, setSelectedProduct] = useState(null);
            const [searchQuery, setSearchQuery] = useState('');
            const [isSearchOpen, setIsSearchOpen] = useState(false);
            const [activeCategory, setActiveCategory] = useState('todos');
            const [sortBy, setSortBy] = useState('relevance');
            const [priceRange, setPriceRange] = useState([0, 1500]);
            const [selectedSizes, setSelectedSizes] = useState([]);
            const [selectedColors, setSelectedColors] = useState([]);
            const [viewMode, setViewMode] = useState('grid');
            const [showFilters, setShowFilters] = useState(false);
            const [quickViewProduct, setQuickViewProduct] = useState(null);
            const [compareList, setCompareList] = useState([]);

            useEffect(() => {
                if (darkMode) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
            }, [darkMode]);

            const addToast = useCallback((message, type = 'success') => {
                const id = Date.now() + Math.random();
                setToasts(prev => [...prev, { id, message, type }]);
                setTimeout(() => {
                    setToasts(prev => prev.filter(t => t.id !== id));
                }, 3000);
            }, []);

            const addToCart = useCallback((product, size, color) => {
                setCart(prev => {
                    const existing = prev.find(item => item.id === product.id && item.size === size && item.color === color);
                    if (existing) {
                        return prev.map(item =>
                            item.id === product.id && item.size === size && item.color === color
                                ? { ...item, quantity: item.quantity + 1 }
                                : item
                        );
                    }
                    return [...prev, { ...product, size, color, quantity: 1, cartId: Date.now() }];
                });
                addToast(`${product.name} adicionado ao carrinho!`);
            }, [addToast]);

            const removeFromCart = useCallback((cartId) => {
                setCart(prev => prev.filter(item => item.cartId !== cartId));
                addToast('Item removido do carrinho', 'info');
            }, [addToast]);

            const updateQuantity = useCallback((cartId, delta) => {
                setCart(prev => prev.map(item => {
                    if (item.cartId === cartId) {
                        const newQty = Math.max(1, item.quantity + delta);
                        return { ...item, quantity: newQty };
                    }
                    return item;
                }));
            }, []);

            const toggleWishlist = useCallback((productId) => {
                setWishlist(prev => {
                    if (prev.includes(productId)) {
                        addToast('Removido dos favoritos', 'info');
                        return prev.filter(id => id !== productId);
                    }
                    addToast('Adicionado aos favoritos!');
                    return [...prev, productId];
                });
            }, [addToast]);

            const toggleCompare = useCallback((productId) => {
                setCompareList(prev => {
                    if (prev.includes(productId)) {
                        addToast('Removido da comparação', 'info');
                        return prev.filter(id => id !== productId);
                    }
                    if (prev.length >= 3) {
                        addToast('Máximo de 3 produtos para comparar', 'error');
                        return prev;
                    }
                    addToast('Adicionado à comparação');
                    return [...prev, productId];
                });
            }, [addToast]);

            const clearFilters = useCallback(() => {
                setActiveCategory('todos');
                setPriceRange([0, 1500]);
                setSelectedSizes([]);
                setSelectedColors([]);
                setSortBy('relevance');
                setSearchQuery('');
            }, []);

            const filteredProducts = useMemo(() => {
                let result = productsData.filter(product => {
                    const matchesSearch = product.name.toLowerCase().includes(searchQuery.toLowerCase()) ||
                                        product.category.toLowerCase().includes(searchQuery.toLowerCase()) ||
                                        product.tags.some(tag => tag.includes(searchQuery.toLowerCase()));
                    const matchesCategory = activeCategory === 'todos' || 
                                           product.category === activeCategory || 
                                           product.gender === activeCategory ||
                                           (activeCategory === 'promocoes' && product.discount > 0) ||
                                           (activeCategory === 'novidades' && product.isNew);
                    const matchesPrice = product.price >= priceRange[0] && product.price <= priceRange[1];
                    const matchesSize = selectedSizes.length === 0 || selectedSizes.some(size => product.sizes.includes(size));
                    const matchesColor = selectedColors.length === 0 || selectedColors.some(color => product.colors.includes(color));

                    return matchesSearch && matchesCategory && matchesPrice && matchesSize && matchesColor;
                });

                switch(sortBy) {
                    case 'price-low': result.sort((a, b) => a.price - b.price); break;
                    case 'price-high': result.sort((a, b) => b.price - a.price); break;
                    case 'rating': result.sort((a, b) => b.rating - a.rating); break;
                    case 'discount': result.sort((a, b) => b.discount - a.discount); break;
                    case 'newest': result.sort((a, b) => (b.isNew ? 1 : 0) - (a.isNew ? 1 : 0)); break;
                    default: break;
                }

                return result;
            }, [searchQuery, activeCategory, priceRange, selectedSizes, selectedColors, sortBy]);

            const cartTotal = cart.reduce((sum, item) => sum + item.price * item.quantity, 0);
            const cartCount = cart.reduce((sum, item) => sum + item.quantity, 0);
            const activeFiltersCount = (activeCategory !== 'todos' ? 1 : 0) + 
                                      (priceRange[0] > 0 || priceRange[1] < 1500 ? 1 : 0) +
                                      selectedSizes.length + selectedColors.length;

            return (
                <AppContext.Provider value={{
                    darkMode, setDarkMode,
                    cart, setCart, addToCart, removeFromCart, updateQuantity, cartTotal, cartCount,
                    wishlist, toggleWishlist,
                    toasts, addToast,
                    currentPage, setCurrentPage,
                    selectedProduct, setSelectedProduct,
                    searchQuery, setSearchQuery,
                    isSearchOpen, setIsSearchOpen,
                    activeCategory, setActiveCategory,
                    sortBy, setSortBy,
                    priceRange, setPriceRange,
                    selectedSizes, setSelectedSizes,
                    selectedColors, setSelectedColors,
                    viewMode, setViewMode,
                    showFilters, setShowFilters,
                    quickViewProduct, setQuickViewProduct,
                    compareList, toggleCompare,
                    clearFilters,
                    filteredProducts,
                    productsData,
                    activeFiltersCount
                }}>
                    {children}
                </AppContext.Provider>
            );
        };

        const useApp = () => useContext(AppContext);

        const Toast = ({ message, type }) => {
            const icons = {
                success: 'fa-check-circle text-green-500',
                info: 'fa-info-circle text-blue-500',

            };

            return (
                <div className="toast-enter fixed top-24 right-4 z-[70] bg-white dark:bg-darkSecondary shadow-2xl rounded-2xl p-4 flex items-center gap-3 min-w-[320px] border border-gray-100 dark:border-gray-700">
                    <i className={`fas ${icons[type]} text-xl`}></i>
                    <span className="text-sm font-medium text-gray-800 dark:text-white">{message}</span>
                </div>
            );
        };

        const Header = () => {

            const [isCartOpen, setIsCartOpen] = useState(false);

                return () => window.removeEventListener('scroll', handleScroll);

                { label: 'Home', value: 'home' },

                                            {link.label}

                                        </button>

                                </nav>

                                        {cartCount > 0 && (

                                                {cartCount}

        const CartDrawer = ({ isOpen, onClose }) => {

            useEffect(() => {
                if (isSearchOpen && inputRef.current) {

                }
            }, [isSearchOpen]);

            const handleProductClick = (product) => {
                setSelectedProduct(product);
                setCurrentPage('product');
                setIsSearchOpen(false);
                setSearchQuery('');
            };

            return (
                <div className={`fixed inset-0 z-[55] transition-all duration-300 ${isSearchOpen ? 'opacity-100 visible' : 'opacity-0 invisible'}`}>
                    <div className="absolute inset-0 bg-black/70 backdrop-blur-md" onClick={() => setIsSearchOpen(false)}></div>
                    <div className="absolute top-20 left-1/2 transform -translate-x-1/2 w-full max-w-2xl px-4">
                        <div className="bg-white dark:bg-dark rounded-3xl shadow-2xl overflow-hidden border border-gray-100 dark:border-gray-800">
                            <div className="p-4 border-b border-gray-100 dark:border-gray-800 flex items-center gap-3">
                                <i className="fas fa-search text-gray-400 text-lg"></i>
                                <input ref={inputRef} type="text" placeholder="Buscar produtos, categorias, estilos..."
                                    value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)}
                                    className="flex-1 bg-transparent outline-none text-lg dark:text-white placeholder-gray-400" />
                                <button onClick={() => setIsSearchOpen(false)} className="text-gray-400 hover:text-gray-600 dark:hover:text-white p-2">
                                    <i className="fas fa-times"></i>
                                </button>
                            </div>

                            {!searchQuery && (
                                <div className="p-4">
                                    <p className="text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wider mb-3">Buscas recentes</p>
                                    <div className="flex flex-wrap gap-2">
                                        {recentSearches.map(term => (
                                            <button key={term} onClick={() => setSearchQuery(term)}
                                                className="px-4 py-2 bg-gray-100 dark:bg-darkSecondary rounded-full text-sm text-gray-700 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-darkTertiary transition-colors">
                                                <i className="fas fa-history mr-2 text-gray-400"></i>
                                                {term}
                                            </button>
                                        ))}
                                    </div>
                                </div>
                            )}

                            {searchQuery && (
                                <div className="max-h-[60vh] overflow-y-auto p-4">
                                    {filteredProducts.length > 0 ? (
                                        <div className="space-y-3">
                                            <p className="text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wider mb-2">
                                                {filteredProducts.length} resultado{filteredProducts.length !== 1 ? 's' : ''}
                                            </p>
                                            {filteredProducts.slice(0, 6).map(product => (
                                                <button key={product.id} onClick={() => handleProductClick(product)}
                                                    className="flex items-center gap-4 w-full p-3 rounded-2xl hover:bg-gray-50 dark:hover:bg-darkSecondary transition-colors text-left group">
                                                    <img src={product.image} alt={product.name} className="w-16 h-16 object-cover rounded-xl" loading="lazy" />
                                                    <div className="flex-1">
                                                        <h4 className="font-medium dark:text-white group-hover:text-primary transition-colors">{product.name}</h4>
                                                        <p className="text-sm text-gray-500 dark:text-gray-400">{product.category}</p>
                                                        <div className="flex items-center gap-2 mt-1">
                                                            <span className="text-sm font-bold text-primary">R$ {product.price.toFixed(2)}</span>
                                                            {product.oldPrice && (
                                                                <span className="text-xs text-gray-400 line-through">R$ {product.oldPrice.toFixed(2)}</span>
                                                            )}
                                                        </div>
                                                    </div>
                                                    <i className="fas fa-chevron-right text-gray-300 dark:text-gray-600 group-hover:text-primary transition-colors"></i>
                                                </button>
                                            ))}
                                        </div>
                                    ) : (
                                        <div className="text-center py-12">
                                            <i className="fas fa-search text-4xl text-gray-300 dark:text-gray-700 mb-4"></i>
                                            <p className="text-gray-500 dark:text-gray-400">Nenhum produto encontrado para "{searchQuery}"</p>
                                            <p className="text-sm text-gray-400 dark:text-gray-500 mt-2">Tente buscar por categorias como "jaqueta", "tênis" ou "vestido"</p>
                                        </div>
                                    )}
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        const HeroSection = () => {
            return (
                <section className="relative h-screen min-h-[700px] flex items-center overflow-hidden">
                    <div className="absolute inset-0 parallax-bg" style={{
                        backgroundImage: 'url(https://images.unsplash.com/photo-1441986300917-64674bd600d8?w=1920&h=1080&fit=crop&q=80)'
                    }}></div>
                    <div className="absolute inset-0 bg-gradient-to-r from-black/80 via-black/50 to-transparent"></div>
                    <div className="absolute inset-0 bg-gradient-to-t from-black/40 to-transparent"></div>

                    <div className="relative z-10 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 w-full">
                        <div className="max-w-2xl animate-slide-up">
                            <span className="inline-flex items-center gap-2 px-4 py-2 bg-primary/20 backdrop-blur-sm rounded-full text-primary font-semibold text-sm mb-6 border border-primary/30">
                                <span className="w-2 h-2 bg-primary rounded-full badge-pulse"></span>
                                Nova Coleção 2026
                            </span>
                            <h1 className="text-5xl md:text-7xl lg:text-8xl font-black text-white leading-[0.95] mb-6 tracking-tight">
                                Estilo,<br />
                                Conforto<br />
                                <span className="text-gradient">& Atitude</span>
                            </h1>
                            <p className="text-xl text-gray-300 mb-10 leading-relaxed max-w-lg">
                                Descubra peças exclusivas que definem quem você é. 
                                Moda premium com até 50% OFF na nova coleção.
                            </p>
                            <div className="flex flex-wrap gap-4">
                                <button onClick={() => document.getElementById('produtos').scrollIntoView({ behavior: 'smooth' })}
                                    className="px-8 py-4 bg-gradient-premium text-white rounded-full font-bold text-lg hover:shadow-xl hover:shadow-primary/40 transition-all transform hover:scale-105 flex items-center gap-2">
                                    <span>Comprar Agora</span>
                                    <i className="fas fa-arrow-right"></i>
                                </button>
                                <button onClick={() => document.getElementById('novidades').scrollIntoView({ behavior: 'smooth' })}
                                    className="px-8 py-4 bg-white/10 backdrop-blur-sm text-white border border-white/30 rounded-full font-bold text-lg hover:bg-white/20 transition-all flex items-center gap-2">
                                    <span>Ver Novidades</span>
                                    <i className="fas fa-sparkles"></i>
                                </button>
                            </div>
                        </div>
                    </div>

                    <div className="absolute bottom-10 left-1/2 transform -translate-x-1/2 scroll-indicator">
                        <div className="w-8 h-12 border-2 border-white/50 rounded-full flex justify-center pt-2">
                            <div className="w-1.5 h-3 bg-white rounded-full animate-pulse"></div>
                        </div>
                    </div>
                </section>
            );
        };

        const ProductCard = ({ product, viewMode = 'grid' }) => {
            const { addToCart, toggleWishlist, wishlist, setSelectedProduct, setCurrentPage, toggleCompare, compareList, setQuickViewProduct } = useApp();
            const [isHovered, setIsHovered] = useState(false);

            const handleAddToCart = (e) => {
                e.stopPropagation();
                addToCart(product, product.sizes[0], product.colors[0]);
            };

            const handleProductClick = () => {
                setSelectedProduct(product);
                setCurrentPage('product');
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            const handleQuickView = (e) => {
                e.stopPropagation();
                setQuickViewProduct(product);
            };

            if (viewMode === 'list') {
                return (
                    <div className="product-list-item flex gap-6 p-4 bg-white dark:bg-darkSecondary rounded-2xl border border-gray-100 dark:border-gray-800 hover:border-primary/30 dark:hover:border-primary/30 transition-all cursor-pointer group"
                        onClick={handleProductClick}>
                        <div className="relative w-48 h-48 flex-shrink-0 overflow-hidden rounded-xl bg-gray-100 dark:bg-darkTertiary">
                            <img src={product.image} alt={product.name} className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" loading="lazy" />
                            {product.discount > 0 && (
                                <span className="absolute top-2 left-2 px-2 py-1 bg-red-500 text-white text-xs font-bold rounded-lg">-{product.discount}%</span>
                            )}
                            {product.isNew && (
                                <span className="absolute top-2 right-2 px-2 py-1 bg-primary text-white text-xs font-bold rounded-lg">NOVO</span>
                            )}
                        </div>
                        <div className="flex-1 flex flex-col justify-between py-1">
                            <div>
                                <p className="text-xs text-primary font-semibold uppercase tracking-wider mb-1">{product.category}</p>
                                <h3 className="font-bold text-lg dark:text-white group-hover:text-primary transition-colors mb-2">{product.name}</h3>
                                <p className="text-sm text-gray-500 dark:text-gray-400 line-clamp-2 mb-3">{product.description}</p>
                                <div className="flex items-center gap-2 mb-3">
                                    <div className="flex text-yellow-400 text-xs">
                                        {[...Array(5)].map((_, i) => (
                                            <i key={i} className={`fas fa-star ${i < Math.floor(product.rating) ? '' : 'text-gray-300 dark:text-gray-600'}`}></i>
                                        ))}
                                    </div>
                                    <span className="text-xs text-gray-500">{product.rating} ({product.reviews})</span>
                                </div>
                                <div className="flex items-center gap-2 mb-2">
                                    {product.colors.map((color, idx) => (
                                        <span key={idx} className="w-4 h-4 rounded-full border border-gray-200 dark:border-gray-700" style={{ backgroundColor: color }}></span>
                                    ))}
                                </div>
                            </div>
                            <div className="flex items-center justify-between">
                                <div className="flex items-baseline gap-2">
                                    <span className="text-xl font-bold text-primary">R$ {product.price.toFixed(2)}</span>
                                    {product.oldPrice && (
                                        <span className="text-sm text-gray-400 line-through">R$ {product.oldPrice.toFixed(2)}</span>
                                    )}
                                </div>
                                <div className="flex items-center gap-2">
                                    <button onClick={(e) => { e.stopPropagation(); toggleWishlist(product.id); }}
                                        className={`w-10 h-10 rounded-full flex items-center justify-center transition-all ${
                                            wishlist.includes(product.id) ? 'bg-red-500 text-white' : 'bg-gray-100 dark:bg-darkTertiary text-gray-600 dark:text-gray-300 hover:bg-gray-200'
                                        }`}>
                                        <i className={`${wishlist.includes(product.id) ? 'fas' : 'far'} fa-heart`}></i>
                                    </button>
                                    <button onClick={(e) => { e.stopPropagation(); toggleCompare(product.id); }}
                                        className={`w-10 h-10 rounded-full flex items-center justify-center transition-all ${
                                            compareList.includes(product.id) ? 'bg-accent text-white' : 'bg-gray-100 dark:bg-darkTertiary text-gray-600 dark:text-gray-300 hover:bg-gray-200'
                                        }`}>
                                        <i className="fas fa-exchange-alt text-sm"></i>
                                    </button>
                                    <button onClick={handleAddToCart}
                                        className="px-6 py-2.5 bg-gradient-premium text-white rounded-full font-semibold hover:opacity-90 transition-opacity flex items-center gap-2">
                                        <i className="fas fa-shopping-bag text-sm"></i>
                                        Adicionar
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div className="product-card group cursor-pointer"
                    onMouseEnter={() => setIsHovered(true)}
                    onMouseLeave={() => setIsHovered(false)}
                    onClick={handleProductClick}>
                    <div className="relative overflow-hidden rounded-2xl bg-gray-100 dark:bg-darkSecondary aspect-[3/4] mb-4">
                        <div className="product-image-container w-full h-full">
                            <img src={product.image} alt={product.name} className="w-full h-full object-cover" loading="lazy" />
                        </div>

                        <div className="absolute top-3 left-3 flex flex-col gap-2 z-10">
                            {product.isNew && (
                                <span className="px-3 py-1 bg-primary text-white text-xs font-bold rounded-full shadow-lg">NOVO</span>
                            )}
                            {product.discount > 0 && (
                                <span className="px-3 py-1 bg-red-500 text-white text-xs font-bold rounded-full shadow-lg">-{product.discount}%</span>
                            )}
                        </div>

                        <div className="absolute top-3 right-3 flex flex-col gap-2 z-10">
                            <button onClick={(e) => { e.stopPropagation(); toggleWishlist(product.id); }}
                                className={`w-10 h-10 rounded-full flex items-center justify-center transition-all shadow-lg ${
                                    wishlist.includes(product.id) ? 'bg-red-500 text-white' : 'bg-white/90 dark:bg-dark/90 text-gray-600 dark:text-gray-300 hover:bg-white'
                                }`}>
                                <i className={`${wishlist.includes(product.id) ? 'fas' : 'far'} fa-heart`}></i>
                            </button>
                            <button onClick={(e) => { e.stopPropagation(); toggleCompare(product.id); }}
                                className={`w-10 h-10 rounded-full flex items-center justify-center transition-all shadow-lg ${
                                    compareList.includes(product.id) ? 'bg-accent text-white' : 'bg-white/90 dark:bg-dark/90 text-gray-600 dark:text-gray-300 hover:bg-white'
                                }`}>
                                <i className="fas fa-exchange-alt text-sm"></i>
                            </button>
                        </div>

                        <div className={`product-overlay absolute bottom-0 left-0 right-0 p-4 bg-gradient-to-t from-black/60 to-transparent`}>
                            <div className="flex gap-2 transform transition-transform duration-300 ${isHovered ? 'translate-y-0' : 'translate-y-2'}">
                                <button onClick={handleQuickView}
                                    className="flex-1 py-2.5 bg-white/90 dark:bg-dark/90 backdrop-blur-sm text-dark dark:text-white font-semibold rounded-xl hover:bg-white transition-colors text-sm">
                                    <i className="far fa-eye mr-1"></i> Visualizar
                                </button>
                                <button onClick={handleAddToCart}
                                    className="flex-1 py-2.5 bg-gradient-premium text-white font-semibold rounded-xl hover:opacity-90 transition-opacity text-sm flex items-center justify-center gap-1">
                                    <i className="fas fa-shopping-bag"></i> Adicionar
                                </button>
                            </div>
                        </div>

                        {product.stock <= 5 && (
                            <div className="absolute bottom-16 left-3 right-3">
                                <span className="px-3 py-1 bg-orange-500/90 text-white text-xs font-bold rounded-full">
                                    <i className="fas fa-fire mr-1"></i> Apenas {product.stock} unidades
                                </span>
                            </div>
                        )}
                    </div>

                    <div className="space-y-2 px-1">
                        <div className="flex items-center justify-between">
                            <p className="text-xs text-gray-500 dark:text-gray-400 uppercase tracking-wider">{product.category}</p>
                            <div className="flex items-center gap-1">
                                <i className="fas fa-star text-yellow-400 text-xs"></i>
                                <span className="text-xs text-gray-500">{product.rating}</span>
                            </div>
                        </div>
                        <h3 className="font-semibold text-gray-900 dark:text-white group-hover:text-primary transition-colors line-clamp-2">
                            {product.name}
                        </h3>
                        <div className="flex items-center gap-2">
                            <span className="text-lg font-bold text-primary price-tag">R$ {product.price.toFixed(2)}</span>
                            {product.oldPrice && (
                                <span className="text-sm text-gray-400 line-through">R$ {product.oldPrice.toFixed(2)}</span>
                            )}
                        </div>
                        <div className="flex items-center gap-1.5 pt-1">
                            {product.colors.slice(0, 4).map((color, idx) => (
                                <span key={idx} className="w-3 h-3 rounded-full border border-gray-200 dark:border-gray-700" style={{ backgroundColor: color }}></span>
                            ))}
                            {product.colors.length > 4 && (
                                <span className="text-xs text-gray-400">+{product.colors.length - 4}</span>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        const FilterSidebar = () => {
            const { 
                priceRange, setPriceRange, 
                selectedSizes, setSelectedSizes,
                selectedColors, setSelectedColors,
                activeCategory, setActiveCategory,
                clearFilters, activeFiltersCount,
                productsData
            } = useApp();

            const allSizes = [...new Set(productsData.flatMap(p => p.sizes))].filter(s => s !== 'Único');
            const allColors = [...new Set(productsData.flatMap(p => p.colors))];
            const colorMap = {};
            productsData.forEach(p => {
                p.colors.forEach((c, i) => {
                    if (!colorMap[c]) colorMap[c] = p.colorNames[i];
                });
            });

            const categories = [
                { label: 'Todos', value: 'todos', count: productsData.length },
                { label: 'Masculino', value: 'masculino', count: productsData.filter(p => p.gender === 'masculino' || p.category === 'masculino').length },
                { label: 'Feminino', value: 'feminino', count: productsData.filter(p => p.gender === 'feminino' || p.category === 'feminino').length },
                { label: 'Camisetas', value: 'camisetas', count: productsData.filter(p => p.category === 'camisetas').length },
                { label: 'Calçados', value: 'calcados', count: productsData.filter(p => p.category === 'calcados').length },
                { label: 'Jaquetas', value: 'jaquetas', count: productsData.filter(p => p.category === 'jaquetas').length },
                { label: 'Acessórios', value: 'acessorios', count: productsData.filter(p => p.category === 'acessorios').length },
            ];

            return (
                <div className="space-y-8">
                    <div className="flex items-center justify-between">
                        <h3 className="font-bold text-lg dark:text-white">Filtros</h3>
                        {activeFiltersCount > 0 && (
                            <button onClick={clearFilters} className="text-sm text-primary hover:text-primaryDark font-medium flex items-center gap-1">
                                <i className="fas fa-times-circle"></i> Limpar ({activeFiltersCount})
                            </button>
                        )}
                    </div>

                    <div>
                        <h4 className="font-semibold text-sm uppercase tracking-wider text-gray-500 dark:text-gray-400 mb-3">Categorias</h4>
                        <div className="space-y-1">
                            {categories.map(cat => (
                                <button key={cat.value} onClick={() => setActiveCategory(cat.value)}
                                    className={`w-full flex items-center justify-between px-3 py-2 rounded-xl text-sm transition-all ${
                                        activeCategory === cat.value 
                                            ? 'bg-primary/10 text-primary font-semibold' 
                                            : 'text-gray-700 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-darkSecondary'
                                    }`}>
                                    <span>{cat.label}</span>
                                    <span className={`text-xs px-2 py-0.5 rounded-full ${
                                        activeCategory === cat.value ? 'bg-primary/20 text-primary' : 'bg-gray-100 dark:bg-darkTertiary text-gray-500'
                                    }`}>{cat.count}</span>
                                </button>
                            ))}
                        </div>
                    </div>

                    <div>
                        <h4 className="font-semibold text-sm uppercase tracking-wider text-gray-500 dark:text-gray-400 mb-3">Preço</h4>
                        <div className="px-1">
                            <input 
                                type="range" 
                                min="0" 
                                max="1500" 
                                value={priceRange[1]} 
                                onChange={(e) => setPriceRange([priceRange[0], parseInt(e.target.value)])}
                                className="range-slider mb-4"
                            />
                            <div className="flex items-center justify-between text-sm">
                                <span className="px-3 py-1.5 bg-gray-100 dark:bg-darkSecondary rounded-lg font-medium dark:text-white">R$ {priceRange[0]}</span>
                                <span className="text-gray-400">até</span>
                                <span className="px-3 py-1.5 bg-gray-100 dark:bg-darkSecondary rounded-lg font-medium dark:text-white">R$ {priceRange[1]}</span>
                            </div>
                        </div>
                    </div>

                    <div>
                        <h4 className="font-semibold text-sm uppercase tracking-wider text-gray-500 dark:text-gray-400 mb-3">Tamanhos</h4>
                        <div className="flex flex-wrap gap-2">
                            {allSizes.map(size => (
                                <button key={size} onClick={() => {
                                    setSelectedSizes(prev => prev.includes(size) ? prev.filter(s => s !== size) : [...prev, size]);
                                }}
                                    className={`w-10 h-10 rounded-xl text-sm font-medium transition-all ${
                                        selectedSizes.includes(size)
                                            ? 'bg-gradient-premium text-white shadow-lg shadow-primary/30'
                                            : 'bg-gray-100 dark:bg-darkSecondary text-gray-700 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-darkTertiary'
                                    }`}>
                                    {size}
                                </button>
                            ))}
                        </div>
                    </div>

                    <div>
                        <h4 className="font-semibold text-sm uppercase tracking-wider text-gray-500 dark:text-gray-400 mb-3">Cores</h4>
                        <div className="flex flex-wrap gap-3">
                            {allColors.map(color => (
                                <button key={color} onClick={() => {
                                    setSelectedColors(prev => prev.includes(color) ? prev.filter(c => c !== color) : [...prev, color]);
                                }}
                                    className={`group relative w-8 h-8 rounded-full transition-all ${
                                        selectedColors.includes(color) ? 'ring-2 ring-primary ring-offset-2 dark:ring-offset-dark' : ''
                                    }`}
                                    style={{ backgroundColor: color }}
                                    title={colorMap[color] || color}>
                                    <span className="absolute inset-0 rounded-full shadow-inner"></span>
                                </button>
                            ))}
                        </div>
                    </div>
                </div>
            );
        };

        const QuickViewModal = () => {
            const { quickViewProduct, setQuickViewProduct, addToCart, toggleWishlist, wishlist } = useApp();
            const [selectedSize, setSelectedSize] = useState(quickViewProduct?.sizes[0]);
            const [selectedColor, setSelectedColor] = useState(0);

            if (!quickViewProduct) return null;

            return (
                <div className="fixed inset-0 z-[65] flex items-center justify-center p-4" onClick={() => setQuickViewProduct(null)}>
                    <div className="absolute inset-0 bg-black/60 backdrop-blur-sm"></div>
                    <div className="quick-view-modal relative bg-white dark:bg-dark rounded-3xl shadow-2xl max-w-4xl w-full max-h-[90vh] overflow-y-auto" onClick={e => e.stopPropagation()}>
                        <button onClick={() => setQuickViewProduct(null)} className="absolute top-4 right-4 w-10 h-10 rounded-full bg-gray-100 dark:bg-darkSecondary flex items-center justify-center hover:bg-gray-200 transition-colors z-10">
                            <i className="fas fa-times text-gray-600 dark:text-gray-300"></i>
                        </button>
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-8 p-8">
                            <div className="aspect-[3/4] rounded-2xl overflow-hidden bg-gray-100 dark:bg-darkSecondary">
                                <img src={quickViewProduct.image} alt={quickViewProduct.name} className="w-full h-full object-cover" />
                            </div>
                            <div className="space-y-6">
                                <div>
                                    <p className="text-sm text-primary font-semibold uppercase tracking-wider mb-2">{quickViewProduct.category}</p>
                                    <h2 className="text-3xl font-black dark:text-white mb-2">{quickViewProduct.name}</h2>
                                    <div className="flex items-center gap-4">
                                        <div className="flex text-yellow-400 text-sm">
                                            {[...Array(5)].map((_, i) => (
                                                <i key={i} className={`fas fa-star ${i < Math.floor(quickViewProduct.rating) ? '' : 'text-gray-300 dark:text-gray-600'}`}></i>
                                            ))}
                                        </div>
                                        <span className="text-gray-500">{quickViewProduct.rating} ({quickViewProduct.reviews} avaliações)</span>
                                    </div>
                                </div>
                                <div className="flex items-baseline gap-3">
                                    <span className="text-3xl font-black text-primary">R$ {quickViewProduct.price.toFixed(2)}</span>
                                    {quickViewProduct.oldPrice && (
                                        <span className="text-lg text-gray-400 line-through">R$ {quickViewProduct.oldPrice.toFixed(2)}</span>
                                    )}
                                </div>
                                <p className="text-gray-600 dark:text-gray-300 leading-relaxed">{quickViewProduct.description}</p>
                                <div>
                                    <h4 className="font-semibold dark:text-white mb-3">Cor: {quickViewProduct.colorNames[selectedColor]}</h4>
                                    <div className="flex gap-3">
                                        {quickViewProduct.colors.map((color, idx) => (
                                            <button key={idx} onClick={() => setSelectedColor(idx)}
